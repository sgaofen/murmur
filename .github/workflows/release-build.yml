name: Build Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v0.4.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
          - name: macOS Apple Silicon
            os: macos-14
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Python backend dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      # Bundled into etcli so the macOS App can do live key capture for
      # WeChat 4.1.9+ without the user installing anything (see cli/live_key.py).
      - name: Install macOS live key capture dependency
        if: matrix.platform == 'macos'
        run: python -m pip install -r requirements-mac-keyextract.txt

      # Compile the Frida-free / root-free capture dylib (universal arm64 +
      # x86_64) so etcli.spec can bundle it (see cli/mac_private_copy.py).
      - name: Build macOS private-copy capture dylib
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          sh cli/native/build_keycap.sh
          file cli/native/murmur_keycap.dylib
          test -f cli/native/murmur_keycap.dylib

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Windows installers
        if: matrix.platform == 'windows'
        working-directory: app
        shell: pwsh
        run: npm run tauri:build

      - name: Smoke test bundled backend (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "app/src-tauri/etcli/etcli.exe"
          if (!(Test-Path $exe)) { throw "Missing bundled backend: $exe" }
          foreach ($required in @(
            "app/src-tauri/etcli/_internal/native/wx_key.dll",
            "app/src-tauri/etcli/_internal/native/go_decrypt.dll"
          )) {
            if (!(Test-Path $required)) { throw "Missing native dependency: $required" }
          }

          $proc = Start-Process -FilePath $exe -ArgumentList @("serve", "--port", "19100") -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $info = Invoke-RestMethod "http://127.0.0.1:19100/api/info" -TimeoutSec 2
                if ($info.version) {
                  Write-Host "Backend smoke ok, version=$($info.version)"
                  $ok = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (!$ok) { throw "Bundled backend did not answer /api/info" }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Collect Windows assets
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem app/src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi" } |
            ForEach-Object { Copy-Item $_.FullName -Destination release-assets }
          Get-ChildItem release-assets

      - name: Build macOS app and DMG
        if: matrix.platform == 'macos'
        working-directory: app
        run: npm run tauri:build:dmg

      - name: Smoke test bundled backend (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          test -x app/src-tauri/etcli/etcli
          # Live key capture subcommand must parse its forwarded args (needs "--")
          # and find the bundled frida.
          app/src-tauri/etcli/etcli hook-cc-key-frida -- --help >/dev/null
          # Frida-free capture dylib must have been bundled (see etcli.spec).
          test -f app/src-tauri/etcli/_internal/native/murmur_keycap.dylib
          app/src-tauri/etcli/etcli serve --port 19100 >/tmp/murmur-backend-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:19100/api/info >/tmp/murmur-info.json; then
              python -c "import json; info=json.load(open('/tmp/murmur-info.json', encoding='utf-8')); assert info.get('version'), info; print('Backend smoke ok, version=' + str(info.get('version')))"
              ok=1
              break
            fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then
            cat /tmp/murmur-backend-smoke.log
            exit 1
          fi

      - name: Collect macOS assets
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APP_PATH="app/src-tauri/target/release/bundle/macos/Murmur.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Missing macOS app bundle: $APP_PATH"
            exit 1
          fi

          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" release-assets/Murmur_macOS_AppleSilicon.app.zip

          STAGING="$(mktemp -d)"
          trap 'rm -rf "$STAGING"' EXIT
          ditto "$APP_PATH" "$STAGING/Murmur.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname Murmur -srcfolder "$STAGING" -ov -format UDZO release-assets/Murmur_macOS_AppleSilicon.dmg

          MOUNT_POINT="$STAGING/mount"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_POINT" release-assets/Murmur_macOS_AppleSilicon.dmg
          codesign --verify --deep --strict --verbose=4 "$MOUNT_POINT/Murmur.app"
          hdiutil detach "$MOUNT_POINT"

          ls -lh release-assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
