[package]
name = "murmur"
version = "0.5.0"
description = "Murmur · 你的微信社交故事 — 100% 本地"
authors = ["sgaofen"]
license = "MIT"
repository = "https://github.com/sgaofen/murmur"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# No "devtools" feature: Tauri 2 enables the webview inspector in debug
# builds (`tauri dev`, debug_assertions) on its own, and that feature would
# also enable it in release builds — where anyone at the keyboard could open
# Inspect behind the app lock and call invoke('read_log_tail') etc.
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"

[[bin]]
name = "Murmur"
path = "src/main.rs"
